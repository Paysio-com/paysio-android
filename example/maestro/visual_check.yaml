# Visual check: filled card (detected brand), then the country bottom sheet.
appId: com.paysio.example
---
- runFlow: open_sheet.yaml
- runFlow:
    file: fill_card.yaml
    env:
      NUMBER: "4111111111111111"
      EXPIRY: "1230"
      CVC: "123"
- tapOn: "Card information"
- takeScreenshot: card_filled
- scrollUntilVisible:
    element: "Country"
- tapOn: "Country"
- takeScreenshot: country_sheet
