org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9 defaults: keep the explicit kotlin-android plugin and the classic DSL.
android.builtInKotlin=false
android.newDsl=false

# Maven Central coordinates (group com.paysio, artifact paysio-android).
GROUP=com.paysio
POM_ARTIFACT_ID=paysio-android
VERSION_NAME=0.1.0

# Signing for Maven Central. Leave empty locally; CI supplies them.
# Never commit real values.
signing.keyId=
signing.password=
signing.secretKeyRingFile=
